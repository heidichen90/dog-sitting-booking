spring:
  application:
    name: api
  config:
    import: optional:file:../db.dev.local[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    version: openapi_3_1
  default-produces-media-type: application/json
  override-with-generic-response: false
