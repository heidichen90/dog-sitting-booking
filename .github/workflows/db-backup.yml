name: db-backup

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 18 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-18 age
          /usr/lib/postgresql/18/bin/pg_dump --version

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Dump, encrypt and upload
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          object="gs://${BUCKET}/ddpet-$(date -u +%Y%m%dT%H%M%SZ).dump.age"
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | age -r "$AGE_PUBLIC_KEY" \
            | gcloud storage cp - "$object"
          echo "Uploaded $object"
