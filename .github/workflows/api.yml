name: api

on:
  push:
    branches: [main]
    paths: ['api/**']
  pull_request:
    paths: ['api/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ddpet_test
          POSTGRES_PASSWORD: ddpet_test
          POSTGRES_DB: dd_pet_care_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ddpet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USERNAME: ddpet_test
      DB_PASSWORD: ddpet_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/dd_pet_care_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
